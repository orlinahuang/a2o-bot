<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2O 智慧知識庫助手</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .chat-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .typing-dot {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="w-full border-b border-white/10 glass-panel sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-md shadow-indigo-500/20 text-white font-bold text-lg">
                <i class="fa-solid fa-brain"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-900 tracking-wide">A2O 智慧知識庫助手</h1>
                <p class="text-xs text-slate-500">基於官方規範與內部文件的智能問答系統</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button id="api-key-btn" onclick="openKeyModal()" class="flex items-center space-x-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-lg transition border border-slate-300 shadow-sm">
                <i class="fa-solid fa-key text-amber-500"></i>
                <span id="api-key-status">設定 Groq API Key</span>
            </button>
            <button onclick="clearChat()" title="清除對話紀錄" class="text-slate-400 hover:text-slate-700 p-2 rounded-lg hover:bg-slate-100 transition">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col h-[calc(100vh-80px)]">
        
        <!-- Chat Box Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto chat-scroll space-y-6 pr-2 mb-4">
            <!-- Welcome Message -->
            <div class="flex items-start space-x-4">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex-shrink-0 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="flex-1 bg-white/10 border border-white/10 rounded-2xl p-5 text-slate-200 shadow-xl backdrop-blur-md max-w-2xl leading-relaxed space-y-3">
                    <p class="font-semibold text-white">你好！我是 A2O 智慧知識庫助手。</p>
                    <p class="text-sm text-slate-300">我已經載入了 A2O 公司的所有內部規範、新人須知、退換貨辦法、報價流程以及 WH-12 產品母稿。請隨時向我提問！</p>
                    <div class="pt-2 flex flex-wrap gap-2">
                        <button onclick="sendPreset('客戶收貨後幾天內可以申請退換貨？')" class="text-xs bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/40 text-indigo-200 px-3 py-1.5 rounded-full transition">
                            📦 客戶幾天內可退換貨？
                        </button>
                        <button onclick="sendPreset('業務自己最多可以給到幾折？')" class="text-xs bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/40 text-indigo-200 px-3 py-1.5 rounded-full transition">
                            💰 業務折扣權限是多少？
                        </button>
                        <button onclick="sendPreset('客訴要多久內先回第一封？三段式是什麼？')" class="text-xs bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/40 text-indigo-200 px-3 py-1.5 rounded-full transition">
                            ⏱️ 客訴回覆時效與三段式
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="relative bg-slate-900/80 border border-slate-700/60 rounded-2xl p-3 shadow-2xl backdrop-blur-xl">
            <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-center space-x-3">
                <textarea id="user-input" rows="1" placeholder="請輸入關於 A2O 知識庫的問題... (Shift + Enter 換行)" class="flex-1 bg-transparent border-0 text-slate-100 placeholder-slate-400 focus:ring-0 focus:outline-none resize-none px-3 py-2 text-sm max-h-32 chat-scroll" onkeydown="handleKeydown(event)"></textarea>
                <button type="submit" id="send-btn" class="bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg shadow-indigo-500/25 transition flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- API Key Modal -->
    <div id="key-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
                        <i class="fa-solid fa-key text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold text-white">設定 Groq API Key</h3>
                        <p class="text-xs text-slate-400">金鑰僅會保存在你的瀏覽器 LocalStorage 中</p>
                    </div>
                </div>
                <button onclick="closeKeyModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-3">
                <label class="block text-xs font-semibold text-slate-300">Groq API Key (gsk_...)</label>
                <input type="password" id="api-key-input" placeholder="請輸入您的 Groq API Key" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                <p class="text-[11px] text-slate-500">推薦使用模型：<code class="text-indigo-400">llama-3.3-70b-versatile</code> 或 <code class="text-indigo-400">llama-3.1-8b-instant</code></p>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button type="button" onclick="closeKeyModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800 transition">取消</button>
                <button type="button" onclick="saveApiKey()" class="px-5 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 transition">儲存金鑰</button>
            </div>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script>
        // 知識庫內容內嵌
        const knowledgeBase = `
# A2O 公司知識庫

## 1. 新人須知（2026版，生效日 2026-03-01，已取代 2024 版）
- 上班與請假：上班時間 08:30–17:30，午休 12:00–13:00。請假人資系統線上申請，前一天下班前送出；臨時病假當天 09:00 前打給主管。
- 客戶詢問怎麼接：
  - 一般詢問：1 個工作天內回覆
  - 客訴：4 個工作小時內先回第一封，說明已收到、誰負責、何時再回
  - 所有詢問都要登記在案件庫，寫清楚客戶、產品、狀態
- 報價權限：
  - 業務可以給到牌價 95 折
  - 低於 95 折，或單筆金額超過新台幣 50 萬元，要業務課長核准
  - 海外報價一律經業務課長
- 退換貨：收貨 14 天內可申請，詳細規定看退換貨辦法
- 對外承諾：
  - 交期、認證、保固只能照公司文件講，文件沒寫的不要自己答應
  - 免費到府、賠償、折讓、「保證」這類承諾，一律要主管核准，不可以先答應客戶
  - 產品對外說法以「產品母稿」為準
- 客訴回覆三段式：
  1. 先接住情緒：謝謝告知、造成困擾很抱歉
  2. 再說明處理：需要客戶提供什麼、我們會怎麼做
  3. 最後留窗口：誰負責、什麼時候再回
- 找誰：
  - 規格、認證、品質：品保課 王課長
  - 價格、交期、報價核准：業務課 周課長
  - 退換貨、出貨：物流課 江組長

## 2. 退換貨辦法（版次 2026-03｜負責：物流課 江組長）
- 期限：收貨 14 天內提出申請
- 可以退換的情況：
  - 未拆封、未安裝：可退貨，全額退款
  - 產品瑕疵（例如端子鬆脫、線材破皮）：換新品，運費公司負擔
  - 少零件：補寄缺少的零件，不用寄回整組
- 不能退換的情況：
  - 已安裝、非產品瑕疵（例如買錯規格）
  - 人為損壞、未依說明書安裝
- 包裝破損：
  - 簽收時發現外箱破損，請當場拍照，3 天內通報業務或客服
  - 超過 3 天才通報，要由物流課判斷
- 誰能答應客戶：
  - 第 2 節以內的處理，客服可以直接答應
  - 第 2 節以外的處理（例如免費到府、賠償），要主管核准

## 3. 報價流程（版次 2026-03｜負責：業務課 周課長）
- 步驟：
  1. 確認客戶要的型號、數量、交貨地點、希望時間
  2. 查牌價表，算出報價
  3. 折扣在權限內 → 業務直接出報價單
  4. 折扣超過權限 → 送業務課長核准後再出
  5. 報價單寄出後，在案件庫把狀態改成「已回覆」
- 折扣權限：
  - 業務：牌價 95 折以內
  - 低於 95 折，或單筆超過新台幣 50 萬元：業務課長核准
  - 海外報價：一律業務課長核准；涉及認證的，同時給品保課確認
- 報價單：
  - 有效期 30 天
  - 交期寫「訂單確認後由業務回覆」，不寫死日期

## 4. WH-12 行車記錄器電源線組 產品母稿（核准版 v3，2026-09-01）
- 規格【可對外】：
  - 型式：行車記錄器免拆線電源線組，從保險絲盒取電，熄火後可持續供電做停車監控
  - 輸入：DC 12V／24V 車系通用（9–32V）
  - 輸出：DC 5V 2.5A，附 USB-C 與 Mini USB 兩種接頭
  - 線長：3.5 公尺，PVC 外被
  - 低電壓保護：11.6V／11.8V／12.0V 三段切換（24V 車系自動加倍）
  - 停車監控：熄火後 6／12／24 小時自動斷電，三段切換
  - 保險絲取電座：迷你、標準、低矮迷你三種各 1 個
  - 工作溫度：−30～85°C
- 認證與測試【可對外】：
  - RoHS（第三方檢測報告，2026 年 4 月）
  - REACH SVHC 符合聲明
  - 線材彎折壽命 50 萬次（第三方實驗室報告，2026 年 5 月）
  - 端子與取電座鹽霧測試 96 小時通過（第三方實驗室報告，2026 年 5 月）
- 目前沒有的認證【可對外，但只能說「目前沒有」】：
  - 歐盟 E-Mark（ECE R10 電磁相容）：目前沒有
  - IATF 16949（車廠品質系統驗證）：目前沒有
  - 回覆原則：目前未取得，可以評估。不可以說多久能拿到。
- 保固【可對外】：
  - 降壓模組 5 年、線材與接頭 3 年、保險絲取電座 1 年
  - 須保留購買證明；人為損壞、未依說明書安裝不在保固範圍內
- 適用場景【可對外】：自用車、安裝店/改裝店、計程車/物流車/租賃車隊
- 內部測試中【不可對外】：線材彎折 100 萬次內部測試中，報告未出，對外一律寫 50 萬次。
- 窗口：規格/認證：品保課 王課長；價格/交期：業務課 周課長
`;

        let chatHistory = [];

        // Check API key on load
        window.addEventListener('DOMContentLoaded', () => {
            const key = localStorage.getItem('groq_api_key');
            if (key) {
                document.getElementById('api-key-status').innerText = 'API Key 已設定';
                document.getElementById('api-key-btn').classList.add('border-emerald-500', 'text-emerald-400');
            }
        });

        function openKeyModal() {
            document.getElementById('key-modal').classList.remove('hidden');
            const key = localStorage.getItem('groq_api_key');
            if (key) {
                document.getElementById('api-key-input').value = key;
            }
        }

        function closeKeyModal() {
            document.getElementById('key-modal').classList.add('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) {
                alert('請輸入有效的 API Key');
                return;
            }
            localStorage.setItem('groq_api_key', key);
            document.getElementById('api-key-status').innerText = 'API Key 已設定';
            document.getElementById('api-key-btn').classList.add('border-emerald-500', 'text-emerald-400');
            closeKeyModal();
        }

        function clearChat() {
            if (confirm('確定要清除所有對話紀錄嗎？')) {
                chatHistory = [];
                const container = document.getElementById('chat-container');
                container.innerHTML = `
                    <div class="flex items-start space-x-4">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex-shrink-0 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="flex-1 bg-white/10 border border-white/10 rounded-2xl p-5 text-slate-200 shadow-xl backdrop-blur-md max-w-2xl leading-relaxed space-y-3">
                            <p class="font-semibold text-white">對話已重設。</p>
                            <p class="text-sm text-slate-300">請隨時向我提問關於 A2O 知識庫的問題！</p>
                        </div>
                    </div>
                `;
            }
        }

        function handleKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                document.getElementById('chat-form').requestSubmit();
            }
        }

        function sendPreset(text) {
            document.getElementById('user-input').value = text;
            document.getElementById('chat-form').requestSubmit();
        }

        async function handleSendMessage(event) {
            event.preventDefault();
            const inputEl = document.getElementById('user-input');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            const apiKey = localStorage.getItem('groq_api_key');
            if (!apiKey) {
                alert('請先點擊右上角設定您的 Groq API Key 才能開始對話！');
                openKeyModal();
                return;
            }

            inputEl.value = '';
            inputEl.style.height = 'auto';

            // Append user message
            appendMessage(prompt, 'user');
            chatHistory.push({ role: 'user', content: prompt });

            // Show typing indicator
            const typingId = showTypingIndicator();

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': \`Bearer \${apiKey}\`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            {
                                role: 'system',
                                content: \`你是一個專業的 A2O 企業知識庫智慧助手。請嚴格根據以下提供的「A2O 公司知識庫」內容來回答使用者的問題。如果知識庫中沒有提及，請誠實告知找不到，不可自行捏造。回答時請盡量精準、專業，並可適當標註文件出處或章節。\n\n--- 知識庫內容 ---\n\${knowledgeBase}\`
                            },
                            ...chatHistory
                        ],
                        temperature: 0.3,
                        max_tokens: 2048
                    })
                });

                removeTypingIndicator(typingId);

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || 'API 請求失敗，請檢查 API Key 是否正確。');
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;

                appendMessage(reply, 'assistant');
                chatHistory.push({ role: 'assistant', content: reply });

            } catch (error) {
                removeTypingIndicator(typingId);
                appendMessage(\`❌ 發生錯誤：\${error.message}\`, 'assistant', true);
            }
        }

        function appendMessage(text, sender, isError = false) {
            const container = document.getElementById('chat-container');
            const isUser = sender === 'user';

            const wrapper = document.createElement('div');
            wrapper.className = \`flex items-start space-x-4 \${isUser ? 'flex-row-reverse space-x-reverse' : ''}\`;

            const avatar = document.createElement('div');
            avatar.className = \`w-10 h-10 rounded-xl flex-shrink-0 flex items-center justify-center text-white shadow-lg \${isUser ? 'bg-gradient-to-tr from-emerald-500 to-teal-600 shadow-emerald-500/20' : 'bg-gradient-to-tr from-indigo-500 to-violet-600 shadow-indigo-500/30'}\`;
            avatar.innerHTML = isUser ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

            const bubble = document.createElement('div');
            bubble.className = \`rounded-2xl p-4 md:p-5 shadow-xl max-w-2xl leading-relaxed text-sm md:text-base \${isUser ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white/10 border border-white/10 text-slate-200 rounded-tl-none backdrop-blur-md'}\`;
            
            if (isError) {
                bubble.classList.add('bg-rose-500/20', 'border-rose-500/30', 'text-rose-200');
            }

            if (isUser) {
                bubble.innerText = text;
            } else {
                bubble.innerHTML = marked.parse(text);
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function showTypingIndicator() {
            const container = document.getElementById('chat-container');
            const id = 'typing-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex items-start space-x-4';

            wrapper.innerHTML = \`
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex-shrink-0 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bg-white/10 border border-white/10 rounded-2xl p-4 shadow-xl backdrop-blur-md flex items-center space-x-2">
                    <div class="w-2.5 h-2.5 bg-indigo-400 rounded-full typing-dot"></div>
                    <div class="w-2.5 h-2.5 bg-indigo-400 rounded-full typing-dot"></div>
                    <div class="w-2.5 h-2.5 bg-indigo-400 rounded-full typing-dot"></div>
                </div>
            \`;

            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
